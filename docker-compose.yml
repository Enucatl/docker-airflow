---
x-runner: &runner
  extends:
    file: ../compose-security-baseline/hardening.yml
    service: hardened-xxlarge
  profiles: [runner]
  init: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m,mode=770,uid=${AUTOMATION_UID:-50000},gid=0
  environment: &runner-env
    SSL_CERT_FILE: ${VAULT_CACERT}
    VAULT_ADDR: ${VAULT_ADDR}
    VAULT_CACERT: ${VAULT_CACERT}
    PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-https://phoenix-otlp.${DOCKER_DOMAIN}/v1/traces}
    PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-cyber_analyst}
    OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE: /etc/ssl/certs/ca-certificates.crt
    OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE: /run/secrets/fullchain
    OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY: /run/secrets/key
  volumes:
    - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    - /scratch/archive:/scratch/archive
  secrets: [fullchain, key]
  user: "${AUTOMATION_UID:-50000}:0"
  networks: [default]

services:
  postgres-outputs:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: postgres
    image: postgres:18
    cpu_shares: 512
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: airflow,djangodev
    volumes:
      - postgres-outputs-volume:/var/lib/postgresql/
      - ./config/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh:ro
    healthcheck:
      test: [CMD, pg_isready, -U, airflow]
    ports: ["5432:5432"]
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.postgres-outputs.rule=HostSNI(`postgres.${DOMAIN}`)
      - traefik.tcp.routers.postgres-outputs.tls=true
      - traefik.tcp.routers.postgres-outputs.entrypoints=postgres
      - traefik.tcp.routers.postgres-outputs.service=postgres-outputs
      - traefik.tcp.services.postgres-outputs.loadbalancer.server.port=5432
    networks: [default, traefik_proxy]

  exam:
    <<: *runner
    image: ghcr.io/enucatl/docker-airflow-exam:main
    build:
      context: .
      dockerfile: images/exam/Dockerfile
    environment:
      <<: *runner-env
      AUTOMATION_PIPELINE: exam
    command: [main]

  download-zanzara:
    <<: *runner
    image: ghcr.io/enucatl/docker-airflow-download-zanzara:main
    build:
      context: .
      dockerfile: images/download-zanzara/Dockerfile
    environment:
      <<: *runner-env
      AUTOMATION_PIPELINE: download-zanzara
    command: [main]

  puppet-release-watch:
    <<: *runner
    image: ghcr.io/enucatl/docker-airflow-puppet-release-watch:main
    build:
      context: .
      dockerfile: images/puppet-release-watch/Dockerfile
    environment:
      <<: *runner-env
      AUTOMATION_PIPELINE: puppet-release-watch
    command: [main]

  cyber-analyst:
    <<: *runner
    image: ghcr.io/enucatl/docker-airflow-cyber-analyst:main
    build:
      context: .
      dockerfile: images/cyber-analyst/Dockerfile
    environment:
      <<: *runner-env
      AUTOMATION_PIPELINE: cyber-analyst
    command: [main]

volumes:
  postgres-outputs-volume:

networks:
  default:
  traefik_proxy:
    external: true

secrets:
  fullchain:
    file: ./secrets/fullchain.pem
  key:
    file: ./secrets/key.pem
