[project]
name = "operations-analyst"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "arize-phoenix-otel",
  "automation-core",
  "common",
  "langchain-openai",
  "openinference-instrumentation-langchain",
  "psycopg[binary]",
  "pydantic",
  "niquests",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
automation-core = { workspace = true }
common = { workspace = true }
