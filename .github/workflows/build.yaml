name: Build and Push Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "automation/**"
      - "dags/common/**"
      - "images/**"
      - "packages/**"
  pull_request:
    paths:
      - ".github/workflows/build.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "automation/**"
      - "dags/common/**"
      - "images/**"
      - "packages/**"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      meta_tags: ${{ steps.version.outputs.meta_tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compute image version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short HEAD)"
          version="${short_sha}"

          {
            echo "version=${version}"
            echo "meta_tags<<EOF"
            echo "type=raw,value=${version}"
            echo "type=raw,value=${short_sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  docker:
    needs: prepare
    strategy:
      matrix:
        pipeline:
          - exam
          - download-zanzara
          - puppet-release-watch
          - cyber-analyst
          - operations-analyst
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: Enucatl/docker-compose-security-baseline/.github/workflows/docker-ci.yml@main
    with:
      image_name: ghcr.io/enucatl/docker-airflow-${{ matrix.pipeline }}
      version: ${{ needs.prepare.outputs.version }}
      meta_tags: ${{ needs.prepare.outputs.meta_tags }}
      context: .
      dockerfile: images/${{ matrix.pipeline }}/Dockerfile
      platforms: linux/amd64
      push: ${{ github.event_name != 'pull_request' }}
      fail_on_image_findings: false
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
