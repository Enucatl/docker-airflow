[project]
name = "automation-pipelines"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "automation",
  "automation-core",
  "common",
  "cyber-analyst",
  "download-zanzara",
  "exam",
  "operations-analyst",
  "podcast-statistics",
  "puppet-release-watch",
  "pytest",
  "ruff",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.uv.workspace]
members = ["packages/*", "images/*"]

[tool.uv.sources]
automation = { workspace = true }
automation-core = { workspace = true }
common = { workspace = true }
cyber-analyst = { workspace = true }
download-zanzara = { workspace = true }
exam = { workspace = true }
operations-analyst = { workspace = true }
podcast-statistics = { workspace = true }
puppet-release-watch = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
