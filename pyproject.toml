[project]
name = "automation-pipelines"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
common = ["hvac", "requests"]
exam = [
  { include-group = "common" },
  "playwright",
  "psycopg[binary]",
]
download-zanzara = [{ include-group = "common" }]
puppet-release-watch = [{ include-group = "common" }]
cyber-analyst = [
  { include-group = "common" },
  "arize-phoenix-otel",
  "langchain-openai",
  "langgraph",
  "mac-vendor-lookup",
  "openinference-instrumentation-langchain",
  "psycopg[binary]",
  "pydantic",
]
operations-analyst = [
  { include-group = "common" },
  "arize-phoenix-otel",
  "langchain-openai",
  "psycopg[binary]",
  "pydantic",
]
dev = [
  { include-group = "exam" },
  { include-group = "cyber-analyst" },
  { include-group = "operations-analyst" },
  "pytest",
  "ruff",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = [".", "dags", "packages/automation-core"]
testpaths = ["tests"]
